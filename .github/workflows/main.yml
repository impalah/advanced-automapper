name: package-release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tags:
        description: "Manual launch"

jobs:
  TestBuildAndPublish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install the project
        run: uv sync --all-extras --group dev --group docs

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run type checking
        run: uv run mypy src/

      - name: Run security checks
        run: uv run bandit -r src/

      - name: Run tests
        run: uv run pytest tests/ --cov=src/ --cov-report=term --cov-fail-under=80 -v

      - name: Build documentation
        run: |
          rm -rf docs/
          uv run sphinx-build -q docs_source docs

      - name: Build package
        run: uv build

      - name: Publish on PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
