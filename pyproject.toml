[project]
name = "advanced-automapper"
version = "0.1.15"
description = "Object mapper based on type hints"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "impalah", email = "impalah@gmail.com"}
]
requires-python = ">=3.12"
keywords = ["mapper", "automapper", "typehints", "python", "pydantic", "sqlalchemy", "dataclass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
pynamodb = ["pynamodb>=5.5"]

[project.urls]
Homepage = "https://github.com/impalah/advanced-automapper"
Documentation = "https://impalah.github.io/advanced-automapper/"
Repository = "https://github.com/impalah/advanced-automapper"
Issues = "https://github.com/impalah/advanced-automapper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automapper"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mock>=5.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.9",
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.0",
    "sqlalchemy-stubs>=0.4",
    "pynamodb>=6.1.0",
]
docs = [
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C90"]
exclude = ["tests/data", ".venv"]
fixable = ["ALL"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
pretty = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
